# Everything you need to know about configuring the CMS can be found here:-
# https://decapcms.org/docs/configuration-options/

# When the CMS is opened on localhost AND `npx decap-server` is running
# alongside `jekyll serve`, it talks to that local proxy instead of GitHub -
# no OAuth needed, changes are written straight to your working copy.
# See README.md "Local development" for how to use this.
local_backend: true

backend:
  name: github # Talks directly to the GitHub API
  repo: garethterrace/homepage # GitHub owner/repo
  branch: master # Branch to update (master by default)
  base_url: https://decap-cms-oauth.garethterrace.workers.dev # Cloudflare Worker OAuth relay, see cms-oauth-worker/README.md
  auth_endpoint: auth

media_folder: "assets/img/uploads" # Folder where user uploaded files should go

publish_mode: editorial_workflow # Enable drafts

collections: # A list of collections the CMS should be able to edit
  # POSTS
  - name: "post" # Used in routes, ie.: /admin/collections/:slug/edit
    label: "Post" # Used in the UI, ie.: "New Post"
    folder: "_posts" # The path to the folder where the documents are stored
    sort: "date:desc" # Default is title:asc
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: # The fields each document in this collection have
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string", tagname: "h1"}
      - {label: "Author", name: "author", widget: "string", default: "Gareth Terrace"}
      - {label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss"}
      - label: "Category"
        name: "categories"
        widget: "select"
        options: ["cycling", "travel", "tech", "business"]
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Cover Image", name: "cover", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
    # PAGES (top-level content pages, edited individually)
  - name: "page"
    label: "Page"
    files:
      - label: "About"
        name: "about"
        file: "about.md"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
          - {label: "Title", name: "title", widget: "string", tagname: "h1"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/about/"}
          - {label: "Show in nav", name: "main_nav", widget: "hidden", default: true}
          - {label: "Body", name: "body", widget: "markdown"}
      - label: "Posts archive"
        name: "posts"
        file: "posts.md"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
          - {label: "Title", name: "title", widget: "string", tagname: "h1"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/posts/"}
          - {label: "Show in nav", name: "main_nav", widget: "hidden", default: true}
          - {label: "Body", name: "body", widget: "markdown", required: false}
