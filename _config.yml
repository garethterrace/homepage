# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# External plugins
plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2

# Site settings
title: Gareth Terrace
subtitle: "I made a thing. This is it."
email: garethterrace@gmail.com
name: Gareth Terrace
description: I made a thing. This is it.
baseurl: "" # the subpath of your site if applicable, e.g. /blog
url: "https://garethterrace.co.uk" # the base hostname & protocol for your site, e.g. https://example.com
cover: "/assets/header_image.jpg"

# Permalink format (/blog/ is ignored for pages)
permalink: /blog/:title

# Build settings
markdown: kramdown
inter_post_navigation: true
highlightjs_theme: "monokai-sublime"

# Pagination Settings
# https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  sort_reverse: true

# Archive settings (see https://github.com/jekyll/jekyll-archives/)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: "archive"
  permalinks:
    category: "/category/:name/"
    tag: "/tag/:name/"

# Disqus comments
# disqus_shortname: your-disqus-shortname

# Google analytics
# ga_tracking_id: "UA-XXXX-1"

# Category descriptions (for archive pages)
descriptions:
  - cat: cycling
    desc: "Bikes, and the occasional multi-day ride."
  - cat: travel
    desc: "Trip writeups."
  - cat: tech
    desc: "Software, and the industry around it."
  - cat: business
    desc: "Thoughts on running and working in companies."

# Social icons and sharing options
#
# Social settings are used in two places:
# * In the footer, as links to your personal profiles
# * After each blog post for sharing widgets
social:
  # - name: Twitter
  #   icon: twitter
  #   username: turkeywelder
  #   url: https://twitter.com/turkeywelder
  #   desc: Follow me on Twitter
  #   share: true

  # - name: GitHub
  #   icon: github
