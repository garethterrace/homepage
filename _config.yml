  # - name: Reddit
  #   icon: reddit
  #   username: ""
  #   url: ""
  #   desc: Share to Reddit
  #   share: true

  # - name: "Hacker News"
  #   icon: hacker-news
  #   username: ""
  #   url: ""
  #   desc: Share to Hacker News
  #   share: false

# Social sharing protocols
# These are for automatically generating sharing metadata for FB and Twitter
protocols:
  fb_image: "/assets/header_image.jpg"
  twitter_image: "/assets/header_image.jpg"

# Kramdown options
kramdown:
  # Prevent IDs from being added to h1-h6 tags
  auto_ids: false

# Compress CSS
sass:
  style: compressed
  sass_dir: _sass

# Compress HTML (in liquid via layouts/compress.html)
compress_html:
  clippings: all

# set some common post defaults
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts" # previously `post` in Jekyll 2.2.
    values:
      layout: "post" # set the correct default template for a post

# Exclude from processing.
# The following items will not be processed.
exclude:
  - README.md
  - LICENSE
  - THIRD_PARTY_LICENSES.md
  - Gemfile
  - Gemfile.lock
  - cms-oauth-worker
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
